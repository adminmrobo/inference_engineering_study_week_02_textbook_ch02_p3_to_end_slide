name: 명예의 전당 기록 검사
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
  contents: read
concurrency:
  group: hof-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  check:
    if: contains(github.event.issue.body, 'dance-hof v1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/hof
      - uses: actions/github-script@v7
        with:
          script: |
            await require(process.env.GITHUB_WORKSPACE + '/.github/hof/action.js')({github, context, core})
